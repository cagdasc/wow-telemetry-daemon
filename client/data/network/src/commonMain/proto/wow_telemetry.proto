// Generated by scripts/generate_combat_log_artifacts.py; do not edit.
//
// Binary form of the daemon's WebSocket contract. Field numbers are assigned
// by position in combat-log-spec.yml, so daemon and client must be built from
// the same file; PROTOCOL_VERSION in Hello guards against mismatches.
syntax = "proto3";

package wowtelemetry.v1;

option java_package = "com.cacaosd.wowtelemetry.data.proto";
option java_multiple_files = true;

// Recursive JSON-like value for bracket/array fields without a fixed shape.
message JsonValue {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    sint64 int_value = 3;
    double double_value = 4;
    string string_value = 5;
    JsonList list_value = 6;
  }
}

message JsonList {
  repeated JsonValue values = 1;
}

message NullableInt {
  optional int64 value = 1;
}

message NullableIntList {
  repeated NullableInt values = 1;
}

message Talent {
  optional int64 node_id = 1;
  optional int64 entry_id = 2;
  optional int64 rank = 3;
}

message Talents {
  repeated Talent entries = 1;
}

message Gear {
  optional int64 item_id = 1;
  optional int64 item_level = 2;
  NullableIntList enchants = 3;
  NullableIntList bonus_ids = 4;
  NullableIntList gems = 5;
}

message Gears {
  repeated Gear slots = 1;
}

message ActiveAuras {
  repeated JsonList entries = 1;
}

// One frame per WebSocket binary message. seq is 0 for frames outside the
// replayable sequence (HELLO, REPLAY_GAP, CLEAR_LOG_RESULT).
message Envelope {
  uint64 seq = 1;
  oneof body {
    LogEvent event = 2;
    Control control = 3;
  }
}

message Control {
  oneof kind {
    Hello hello = 1;
    Empty log_caught_up = 2;
    Empty log_cleared = 3;
    ReplayGap replay_gap = 4;
    ClearLogResult clear_log_result = 5;
  }
}

message Empty {}

message Hello {
  uint64 epoch = 1;
  uint64 last_seq = 2;
  uint32 protocol_version = 3;
}

enum ReplayGapReason {
  REPLAY_GAP_REASON_UNSPECIFIED = 0;
  EPOCH_CHANGED = 1;
  INVALID_RESUME = 2;
  BUFFER_EVICTED = 3;
}

message ReplayGap {
  ReplayGapReason reason = 1;
  optional uint64 missed_from = 2;
  optional uint64 available_from = 3;
}

message ClearLogResult {
  bool success = 1;
  optional string message = 2;
}

// Client to daemon.
message Command {
  oneof kind {
    Resume resume = 1;
    Empty clear_log = 2;
  }
}

message Resume {
  uint64 epoch = 1;
  uint64 from_seq = 2;
}

message Header {
  optional string source_guid = 1;
  optional string source_name = 2;
  optional uint64 source_flags = 3;
  optional uint64 source_raid_flags = 4;
  optional string dest_guid = 5;
  optional string dest_name = 6;
  optional uint64 dest_flags = 7;
  optional uint64 dest_raid_flags = 8;
}

