name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-artifacts:
    name: Check generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Set up Rust (for rustfmt in artifact check)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check generated artifacts freshness
        run: python3 daemon/scripts/generate_combat_log_artifacts.py --check

  daemon:
    name: Rust daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
