[package]
name = "wow-telemetry-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
memchr = "2.7"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tungstenite = "0.28"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
lto = true
codegen-units = 1

