gotchas:
  - id: detect-advanced-by-row-width
    title: Detect advanced logging by row width, not header
    details: "COMBAT_LOG_VERSION lies on fragmented logs. Count fields on a SPELL_DAMAGE event: ~22 fields = off, 40+ = on."
  - id: absorbed-field-vs-event
    title: SPELL_DAMAGE absorbed field vs SPELL_ABSORBED event
    details: They are different things. The absorbed field on damage events is informational. Use SPELL_ABSORBED as the source of truth. Counting both double-counts partial absorbs.
  - id: overkill-minus-one
    title: Overkill is -1 when not killing
    details: Clamp to zero before subtracting. Negative overkill means "this was not a killing blow."
  - id: trailing-damage-after-encounter-end
    title: ENCOUNTER_END is not the end of damage
    details: Damage keeps arriving up to ~2 seconds after ENCOUNTER_END. The fight duration in ENCOUNTER_END, and the de-facto standard fight window, end at ENCOUNTER_END. Use one window for every number derived from a fight. Deaths in those seconds belong to the pull.
  - id: talent-entry-id
    title: COMBATANT_INFO talent ID is the entry ID, not spell ID
    details: The middle number in each talent triple is the TraitNodeEntry ID, not the trait definition ID. Resolve via wago.tools or wow.tools.
  - id: mid-log-version-restart
    title: Mid-log COMBAT_LOG_VERSION = logger restarted
    details: Treat as a hard boundary. Reset pet ownership, ongoing auras, fight tracking — accumulated state across the seam is wrong.
  - id: two-spell-absorbed-formats
    title: Two SPELL_ABSORBED formats
    details: 22 fields when shield is on someone else (Disc priest absorbing for tank). 19 fields for self-shields. Count fields before parsing.
  - id: swing-damage-landed-doublecount
    title: SWING_DAMAGE_LANDED double-counts if you read both
    details: It is the same swing as SWING_DAMAGE, reported again with the target advanced block. Count one stream, not both.
  - id: support-event-double-count
    title: _SUPPORT events are the same hit, not extra damage
    details: "Every Aug-buffed hit produces two events with identical baseAmount values: the underlying SPELL_DAMAGE (or SPELL_PERIODIC_DAMAGE / RANGE_DAMAGE) and a parallel _SUPPORT variant. They are the same damage instance, double-logged. Pick one stream and ignore the other — never count both."
  - id: pets-before-summon
    title: Pets deal damage before SPELL_SUMMON
    details: Pre-combat pets (warlock demons, hunter pets, DK ghouls) appear before their summon. Buffer unknown-owner pet damage and reassign retroactively.
  - id: vehicle-possession-guids
    title: Vehicle and possession GUIDs
    details: Mind-control / vehicle entry changes the source GUID. Follow the ownerGUID chain (offset 1 in advanced block) for attribution.
  - id: stagger-and-cheat-death-not-healing
    title: Stagger and cheat-death absorbs are not healing
    details: "Exclude these spell IDs from healing totals: 114556 Purgatory, 31850 Ardent Defender, 31230 Cheat Death, 115069 Stagger."
  - id: aura-stacks-only-on-dose-events
    title: Aura stack field is only valid on _DOSE events
    details: For non-DOSE aura events the field at offset 13 may carry an absorb amount or be absent. Do not blindly read as stacks.
  - id: docs-disagree
    title: Pre-existing combat-log docs disagree with each other
    details: Older references claim ENVIRONMENTAL_DAMAGE puts envType at field 9 — it is actually field 28. SPELL_DAMAGE has 42 fields with an undocumented ST/AOE hint. Verify against real logs.
  - id: target-flag-is-not-boss
    title: 0x00010000 is the logger's target, not a boss flag
    details: It marks the logging player's current target, moves with it, and lands on adds, trash and friendly players. Boss units are the NPC ids of the encounter in ENCOUNTER_START.
  - id: unsigned-utc-offset
    title: Positive UTC offsets have no sign
    details: The fraction is always three digits; anything after it is the offset in hours. "19:41:14.7042" is .704 at UTC+2. Only negative offsets carry "-".
  - id: council-health-summed
    title: Council health is summed
    details: On a multi-boss encounter, progress is sum(current HP) / sum(max HP) over every boss unit, each from its latest advanced-block sample; a dead boss counts 0 of its pool.
  - id: aura-removals-before-unit-died
    title: Aura removals come before UNIT_DIED
    details: A dying unit's SPELL_AURA_REMOVED lines are written at the killing blow's timestamp, before UNIT_DIED. Removals in that final burst were active at death.
  - id: soulstone-removal-is-a-death
    title: A Soulstone removal is usually a death
    details: The Soulstone buff (20707) is removed whenever its holder dies, used or not. Accepting your own stone writes no SPELL_RESURRECT; a warlock stoning a dead player writes SPELL_RESURRECT 95750.
  - id: victim-sourced-debuff
    title: The victim can be the source of their own killing blow
    details: Some encounter debuffs are applied and tick with the afflicted player as source. A DEBUFF with the victim as source is an encounter mechanic; the GUID prefix of the source does not identify the killer.
  - id: keystone-death-penalty
    title: Keystone deaths cost 15 s with Xal'atath's Guile
    details: 15 s per death when affix 147 is in the CHALLENGE_MODE_START affix list, 5 s otherwise. The penalties are included in CHALLENGE_MODE_END total time.
  - id: challenge-mode-end-not-timed
    title: CHALLENGE_MODE_END does not say "timed"
    details: Field 2 is 1 for any completed key, in time or over. Fields 5 and 6 are the run score and the logger's rating.
  - id: reaction-flips-under-mind-control
    title: Reaction flags flip under mind control
    details: While the logger is mind-controlled, their own group is written hostile (still player-controlled). The enemy side is hostile AND not player-controlled.
  - id: pet-npc-id-not-owner
    title: A pet's NPC id is not its owner
    details: Every pet of a family shares one NPC entry id across owners, and pets summoned before logging have no SPELL_SUMMON. Use the ownerGUID in the pet's own advanced block.
  - id: dispel-is-cleanse-and-purge
    title: SPELL_DISPEL is both cleanse and purge
    details: A cleanse removes a debuff from a friendly unit; a purge removes a buff from a hostile one. One line per aura removed. Pets and totems dispel too.
  - id: item-level-16-slots
    title: Item level is over 16 slots
    details: All slots but shirt and tabard; an empty slot counts 0; a two-handed weapon counts in both hands; floor of the mean.
  - id: combatant-info-12x-layout
    title: Patch 12.x moved COMBATANT_INFO fields
    details: "A field was inserted at index 7: ratings moved one place later, armor is field 24, spec id is field 25 (24 in 10.x/11.x)."
  - id: trash-pulls-not-in-log
    title: Trash pulls are not in the log
    details: No trash-pull event exists. Trash has its run's difficulty, can end in a wipe, and can be fought without a damage line (kicks, crowd control, fully absorbed hits).
  - id: self-absorbed-periodic-ticks
    title: Self-inflicted absorbed ticks fill SPELL_PERIODIC_MISSED
    details: Fel Armor, Refraction, Stagger and similar effects are written player-to-self with miss type ABSORB. They are not enemy damage.
  - id: no-fight-ids
    title: The log has no fight ids
    details: Nothing in the file uniquely identifies a fight, pull or line. Identity generated at random differs every time the same file is read; identity derived from the log content does not.

